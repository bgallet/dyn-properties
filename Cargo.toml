[package]
name = "dyn-properties"
version = "0.1.0"
edition = "2024"
description = "Reads a config file — TOML, JSON, or your own Format — into a validated, hot-reloadable struct."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bgallet/dyn-properties"

[dependencies]
dyn-properties-derive = { path = "dyn-properties-derive", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
arc-swap = "1"
tokio = { version = "1", features = ["rt", "time", "fs"], optional = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "fs"] }

[features]
toml = ["dep:toml"]
json = ["dep:serde_json"]
tokio = ["dep:tokio"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "deserialize"
required-features = ["toml"]

[[test]]
name = "watcher"
required-features = ["toml"]

[[test]]
name = "json"
required-features = ["json"]

[[test]]
name = "tokio_watcher"
required-features = ["toml", "tokio"]

[workspace]
members = ["dyn-properties-derive"]
