name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [none, toml, json, all]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Resolve feature flags
        id: flags
        run: |
          case "${{ matrix.features }}" in
            none) echo "flags=--no-default-features" >> "$GITHUB_OUTPUT" ;;
            toml) echo "flags=--no-default-features --features toml" >> "$GITHUB_OUTPUT" ;;
            json) echo "flags=--no-default-features --features json" >> "$GITHUB_OUTPUT" ;;
            all)  echo "flags=--all-features" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: cargo clippy --workspace ${{ steps.flags.outputs.flags }} --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
